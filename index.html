<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be Right Back - Eevee Cozy Room</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background-image: url('background.png.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .scene {
            position: relative;
            width: 1920px;
            height: 1080px;
        }

        /* --- LAYER 2: EEVEE PEEK-A-BOO (Sits behind the desk overlay) --- */
        .eevee-peekaboo {
            position: absolute;
            top: 55px;
            left: 425px;
            width: 450px;
            z-index: 1;
        }

        /* --- LAYER 3: DESK WITH MONITOR OVERLAY --- */
        .desk-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 1920px;
            height: 1080px;
            object-fit: cover;
            z-index: 2;
            pointer-events: none;
        }

        /* --- POPPING TEXT CENTERED DEAD IN THE COMPUTER SCREEN --- */
        .monitor-text-container {
            position: absolute;
            top: 340px;
            left: 470px;
            transform: translate(-50%, -50%);
            z-index: 3;
        }

        .pop-text {
            color: #ff85a1;
            font-size: 3rem;
            font-weight: bold;
            text-align: center;
            text-shadow: 2px 2px 0px #ffffff, 4px 4px 10px rgba(255, 105, 180, 0.4);
            opacity: 0;
            transform: scale(0.5);
            animation: popSequence 120s infinite;
        }

        @keyframes popSequence {
            0% { opacity: 0; transform: scale(0.5); }
            2% { opacity: 1; transform: scale(1.1); }
            4% { opacity: 1; transform: scale(1); }
            35% { opacity: 1; transform: scale(1); }
            39% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 0; transform: scale(0.5); }
        }

        /* --- OTHER EEVEE ANIMATIONS --- */
        video {
            width: 100%;
            height: auto;
            pointer-events: none;
            display: block;
        }

        .eevee-sleep {
            position: absolute;
            bottom: 120px;
            left: 280px;
            width: 450px;
            z-index: 3;
        }

        .eevee-tea {
            position: absolute;
            bottom: 220px;
            left: 1350px;
            width: 400px;
            z-index: 3;
        }

        /* --- LAYER 4: TOWERING MASSIVE PLANT --- */
        .plant-element {
            position: absolute;
            bottom: -150px;
            left: -150px;
            width: 2200px;
            height: auto;
            z-index: 10;
            pointer-events: none;
            transform-origin: bottom left;
            animation: swayPlant 4s infinite ease-in-out;
        }

        @keyframes swayPlant {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(1.5deg); }
        }
    </style>
</head>
<body>

    <div class="scene">
        <!-- Layer 1: Peek-a-boo Eevee (Behind desk) -->
        <div class="eevee-peekaboo">
            <video autoplay muted loop playsinline>
                <source src="Peekaboo.webm" type="video/webm">
            </video>
        </div>

        <!-- Layer 2: Desk and Monitor Overlay -->
        <img src="desk.png.png" alt="Desk" class="desk-layer">

        <!-- Pop-up Text Centered Inside Monitor Screen -->
        <div class="monitor-text-container">
            <div class="pop-text">Be Right Back</div>
        </div>

        <!-- Layer 3: Other Eevees -->
        <div class="eevee-sleep">
            <video autoplay muted loop playsinline>
                <source src="sleep.webm" type="video/webm">
            </video>
        </div>

        <div class="eevee-tea">
            <video autoplay muted loop playsinline>
                <source src="tea.webm" type="video/webm">
            </video>
        </div>

        <!-- Layer 4: Towering Massive Plant -->
        <img src="plant.png.png" alt="Plant" class="plant-element">
    </div>

</body>
</html>
