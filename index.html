<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eevee Cozy Room</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background-color: #fce4ec;
        }

        body {
            background-image: url('background.png.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .scene {
            position: relative;
            width: 1920px;
            height: 1080px;
        }

        /* --- PEEK-A-BOO EEVEE --- */
        .eevee-peekaboo {
            position: absolute;
            top: -50px;
            left: 680px;
            width: 450px;
            z-index: 1;
        }

        .eevee-peekaboo video {
            width: 100%;
            height: auto;
            display: block;
            pointer-events: none;
        }

        /* --- DESK WITH MONITOR OVERLAY --- */
        .desk-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 1920px;
            height: 1080px;
            object-fit: cover;
            z-index: 2;
            pointer-events: none;
        }

        /* --- LAVA LAMP WRAPPER --- */
        .lava-lamp-container {
            position: absolute;
            bottom: 310px;
            left: 1240px;
            width: 165px;
            height: 420px;
            z-index: 3;
            pointer-events: none;
        }

        /* The lamp PNG sits underneath */
        .lava-lamp-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: auto;
            display: block;
            z-index: 1;
            filter: drop-shadow(0 0 15px rgba(255, 182, 193, 0.8));
        }

        /* Chamber containing upper floating blobs */
        .lava-animation-chamber {
            position: absolute;
            top: 96px;
            left: 51px;
            width: 62px;
            height: 120px;
            z-index: 2;
            overflow: hidden;
            border-radius: 20px;
            mix-blend-mode: multiply; 
        }

        .lava-blob-1, .lava-blob-2 {
            position: absolute;
            background: #d81b60;
            border-radius: 50%;
            filter: blur(1.5px);
            opacity: 1;
        }

        .lava-blob-1 {
            width: 42px;
            height: 46px;
            bottom: 22px;
            left: 10px;
            animation: floatBlob1 4s ease-in-out infinite alternate;
        }

        .lava-blob-2 {
            width: 36px;
            height: 40px;
            top: 22px;
            right: 10px;
            animation: floatBlob2 6s ease-in-out infinite alternate;
        }

        /* --- LOWER WAVE LAYER --- */
        .lava-wave-layer {
            position: absolute;
            bottom: 200px;
            left: 38px;
            width: 88px;
            height: 28px;
            z-index: 4;
            overflow: hidden;
            pointer-events: none;
            mix-blend-mode: multiply;
        }

        .lava-bottom-pool {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #d81b60;
            border-radius: 50% 50% 40% 40%;
            filter: blur(1.5px);
            animation: wavePool 4s ease-in-out infinite alternate;
        }

        @keyframes floatBlob1 {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-52px) scale(1.1, 0.9); }
        }

        @keyframes floatBlob2 {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(48px) scale(1.0, 0.9); }
        }

        @keyframes wavePool {
            0% { transform: scale(1, 1); border-radius: 50% 50% 40% 40%; }
            50% { transform: scale(1.05, 0.92); border-radius: 40% 60% 45% 35%; }
            100% { transform: scale(0.95, 1.08); border-radius: 60% 40% 35% 45%; }
        }

        video {
            width: 100%;
            height: auto;
            pointer-events: none;
            display: block;
        }

        /* --- SLEEPING EEVEE --- */
        .eevee-sleep {
            position: absolute;
            bottom: 120px;
            left: 280px;
            width: 450px;
            z-index: 3;
        }

        /* --- TEA EEVEE (Shifted right so tea cup is off the keyboard) --- */
        .eevee-tea {
            position: absolute;
            bottom: 270px;
            left: 1370px;
            width: 400px;
            z-index: 3;
        }

        /* --- MASSIVE PLANT --- */
        .plant-element {
            position: absolute;
            bottom: -150px;
            left: -150px;
            width: 2200px;
            height: auto;
            z-index: 10;
            pointer-events: none;
            transform-origin: bottom left;
            animation: swayPlant 4s infinite ease-in-out;
        }

        @keyframes swayPlant {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(1.5deg); }
        }
    </style>
</head>
<body>

    <div class="scene">
        <div class="eevee-peekaboo">
            <video autoplay muted loop playsinline>
                <source src="Peekaboo.webm" type="video/webm">
            </video>
        </div>

        <img src="desk.png.png" alt="Desk" class="desk-layer">

        <!-- Lava lamp container -->
        <div class="lava-lamp-container">
            <img src="lavalamp.png" alt="Lava Lamp" class="lava-lamp-img">
            <div class="lava-animation-chamber">
                <div class="lava-blob-1"></div>
                <div class="lava-blob-2"></div>
            </div>
            <div class="lava-wave-layer">
                <div class="lava-bottom-pool"></div>
            </div>
        </div>

        <div class="eevee-sleep">
            <video autoplay muted loop playsinline>
                <source src="sleep.webm" type="video/webm">
            </video>
        </div>

        <div class="eevee-tea">
            <video autoplay muted loop playsinline>
                <source src="tea.webm" type="video/webm">
            </video>
        </div>

        <img src="plant.png.png" alt="Plant" class="plant-element">
    </div>

    <script>
        const peekVideo = document.querySelector('.eevee-peekaboo video');
        if (peekVideo) {
            peekVideo.playbackRate = 0.75;
        }
    </script>

</body>
</html>
