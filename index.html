<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Starting Soon - Eevee Cozy Room</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background-image: url('background.png.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .scene {
            position: relative;
            width: 1920px;
            height: 1080px;
        }

        /* --- PRECISE GREEN SCREEN INSIDE COMPUTER MONITOR --- */
        .monitor-green-screen {
            position: absolute;
            top: 205px;
            left: 326px;
            width: 310px;
            height: 310px;
            background-color: #00ff00;
            z-index: 0;
            border-radius: 4px;
        }

        /* --- GREEN SCREEN FOR THE WALL WINDOW --- */
        .window-green-screen {
            position: absolute;
            top: 40px;
            left: 775px;
            width: 155px;
            height: 325px;
            background-color: #00ff00;
            z-index: 0;
        }

        /* --- LAYER 2: DESK WITH MONITOR OVERLAY --- */
        .desk-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 1920px;
            height: 1080px;
            object-fit: cover;
            z-index: 1;
            pointer-events: none;
        }

        /* --- POPPING TEXT INSIDE MONITOR SCREEN --- */
        .monitor-text-container {
            position: absolute;
            top: 35%;
            left: 48%;
            transform: translate(-50%, -50%);
            z-index: 2;
        }

        .pop-text {
            color: #ff85a1;
            font-size: 2.2rem;
            font-weight: bold;
            text-align: center;
            text-shadow: 2px 2px 0px #ffffff, 4px 4px 10px rgba(255, 105, 180, 0.4);
            opacity: 0;
            transform: scale(0.5);
            animation: popSequence 120s infinite;
        }

        @keyframes popSequence {
            0% { opacity: 0; transform: scale(0.5); }
            2% { opacity: 1; transform: scale(1.1); }
            4% { opacity: 1; transform: scale(1); }
            35% { opacity: 1; transform: scale(1); }
            39% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 0; transform: scale(0.5); }
        }

        /* --- LAYER 3: EEVEE ANIMATIONS --- */
        video {
            width: 100%;
            height: auto;
            pointer-events: none;
            display: block;
        }

        /* Bigger Peekaboo Eevee peeking over the top of the monitor */
        .eevee-peekaboo {
            position: absolute;
            top: 170px;
            left: 425px;
            width: 130px;
            z-index: 3;
        }

        .eevee-sleep {
            position: absolute;
            bottom: 300px;
            left: 195px;
            width: 240px;
            z-index: 3;
        }

        .eevee-tea {
            position: absolute;
            bottom: 215px;
            left: 440px;
            width: 220px;
            z-index: 3;
        }

        /* --- LAYER 4: BIGGER PLANT GRAPHIC --- */
        .plant-element {
            position: absolute;
            bottom: -50px;
            left: -80px;
            width: 950px;
            height: auto;
            z-index: 10;
            pointer-events: none;
            transform-origin: bottom left;
            animation: swayPlant 4s infinite ease-in-out;
        }

        @keyframes swayPlant {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(1.5deg); }
        }
    </style>
</head>
<body>

    <div class="scene">
        <!-- Green Screen perfectly inside Computer Monitor -->
        <div class="monitor-green-screen"></div>

        <!-- Green Screen for the Window on the Wall -->
        <div class="window-green-screen"></div>

        <!-- Layer 2: Desk and Monitor -->
        <img src="desk.png.png" alt="Desk" class="desk-layer">

        <!-- Pop-up Text on the Monitor Screen -->
        <div class="monitor-text-container">
            <div class="pop-text">Stream Starting Soon</div>
        </div>

        <!-- Layer 3: Eevees -->
        <div class="eevee-peekaboo">
            <video autoplay muted loop playsinline>
                <source src="Peekaboo.webm" type="video/webm">
            </video>
        </div>

        <div class="eevee-sleep">
            <video autoplay muted loop playsinline>
                <source src="sleep.webm" type="video/webm">
            </video>
        </div>

        <div class="eevee-tea">
            <video autoplay muted loop playsinline>
                <source src="tea.webm" type="video/webm">
            </video>
        </div>

        <!-- Layer 4: Larger Transparent Plant on Left -->
        <img src="plant.png.png" alt="Plant" class="plant-element">
    </div>

</body>
</html>
