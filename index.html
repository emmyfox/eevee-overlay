<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eevee Cozy Room</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background-color: #fce4ec;
        }

        body {
            background-image: url('background.png.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .scene {
            position: relative;
            width: 1920px;
            height: 1080px;
        }

        /* --- LAYER 1: PEEK-A-BOO EEVEE (Placed BEHIND the desk layer with smooth CSS sliding) --- */
        .eevee-peekaboo {
            position: absolute;
            top: -10px;
            left: 680px;
            width: 450px;
            z-index: 1;
            animation: peekABooSlide 6s infinite ease-in-out;
        }

        @keyframes peekABooSlide {
            0%, 20%, 100% {
                transform: translateY(60px); /* Slid down behind the monitor frame */
            }
            40%, 70% {
                transform: translateY(0px); /* Slid up into view! */
            }
        }

        .eevee-peekaboo img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* --- LAYER 2: DESK WITH MONITOR OVERLAY --- */
        .desk-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 1920px;
            height: 1080px;
            object-fit: cover;
            z-index: 2;
            pointer-events: none;
        }

        video {
            width: 100%;
            height: auto;
            pointer-events: none;
            display: block;
        }

        /* --- SLEEPING EEVEE --- */
        .eevee-sleep {
            position: absolute;
            bottom: 120px;
            left: 280px;
            width: 450px;
            z-index: 3;
        }

        /* --- TEA EEVEE --- */
        .eevee-tea {
            position: absolute;
            bottom: 270px;
            left: 1320px;
            width: 400px;
            z-index: 3;
        }

        /* --- MASSIVE PLANT --- */
        .plant-element {
            position: absolute;
            bottom: -150px;
            left: -150px;
            width: 2200px;
            height: auto;
            z-index: 10;
            pointer-events: none;
            transform-origin: bottom left;
            animation: swayPlant 4s infinite ease-in-out;
        }

        @keyframes swayPlant {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(1.5deg); }
        }
    </style>
</head>
<body>

    <div class="scene">
        <!-- Layer 1: Peek-a-boo Eevee (Behind desk, using your new animated image file - update filename if needed) -->
        <div class="eevee-peekaboo">
            <img src="peekaboo.png" alt="Peekaboo Eevee">
        </div>

        <!-- Layer 2: Desk and Monitor Overlay -->
        <img src="desk.png.png" alt="Desk" class="desk-layer">

        <!-- Sleeping Eevee -->
        <div class="eevee-sleep">
            <video autoplay muted loop playsinline>
                <source src="sleep.webm" type="video/webm">
            </video>
        </div>

        <!-- Tea Eevee -->
        <div class="eevee-tea">
            <video autoplay muted loop playsinline>
                <source src="tea.webm" type="video/webm">
            </video>
        </div>

        <!-- Massive Plant -->
        <img src="plant.png.png" alt="Plant" class="plant-element">
    </div>

</body>
</html>
