<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eevee Cozy Room</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background-color: #fce4ec;
        }

        body {
            background-image: url('background.png.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .scene {
            position: relative;
            width: 1920px;
            height: 1080px;
        }

        /* --- PEEK-A-BOO EEVEE --- */
        .eevee-peekaboo {
            position: absolute;
            top: -50px;
            left: 680px;
            width: 450px;
            z-index: 1;
        }

        .eevee-peekaboo video {
            width: 100%;
            height: auto;
            display: block;
            pointer-events: none;
        }

        /* --- DESK WITH MONITOR OVERLAY --- */
        .desk-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 1920px;
            height: 1080px;
            object-fit: cover;
            z-index: 2;
            pointer-events: none;
        }

        /* --- LAVA LAMP (Pure CSS, no PNG needed) --- */
        .lava-lamp {
            position: absolute;
            bottom: 340px;
            left: 1120px;
            width: 60px;
            height: 140px;
            z-index: 3;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .lamp-top, .lamp-bottom {
            width: 24px;
            height: 15px;
            background: #ff758c;
            border-radius: 6px;
        }

        .lamp-bottom {
            border-radius: 6px 6px 12px 12px;
        }

        .lamp-glass {
            width: 44px;
            height: 110px;
            background: linear-gradient(180deg, rgba(255, 117, 140, 0.3), rgba(255, 204, 112, 0.3));
            border-radius: 22px;
            position: relative;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.6);
            box-shadow: inset 0 0 10px rgba(255, 105, 180, 0.5), 0 0 15px rgba(255, 182, 193, 0.6);
        }

        .lava-blob-1, .lava-blob-2 {
            position: absolute;
            background: #ff2a6d;
            border-radius: 50%;
            filter: blur(4px);
        }

        .lava-blob-1 {
            width: 32px;
            height: 38px;
            bottom: 10px;
            left: 6px;
            animation: floatBlob1 7s ease-in-out infinite alternate;
        }

        .lava-blob-2 {
            width: 26px;
            height: 30px;
            top: 10px;
            right: 8px;
            animation: floatBlob2 9s ease-in-out infinite alternate;
        }

        @keyframes floatBlob1 {
            0% { transform: translateY(0) scale(1); border-radius: 50%; }
            50% { transform: translateY(-50px) scale(1.2, 0.9); border-radius: 40% 60% 50% 50%; }
            100% { transform: translateY(-70px) scale(0.9, 1.1); border-radius: 50%; }
        }

        @keyframes floatBlob2 {
            0% { transform: translateY(0) scale(1); border-radius: 50%; }
            50% { transform: translateY(45px) scale(1.1, 0.8); border-radius: 60% 40% 50% 50%; }
            100% { transform: translateY(60px) scale(0.95, 1.05); border-radius: 50%; }
        }

        video {
            width: 100%;
            height: auto;
            pointer-events: none;
            display: block;
        }

        /* --- SLEEPING EEVEE --- */
        .eevee-sleep {
            position: absolute;
            bottom: 120px;
            left: 280px;
            width: 450px;
            z-index: 3;
        }

        /* --- TEA EEVEE --- */
        .eevee-tea {
            position: absolute;
            bottom: 270px;
            left: 1320px;
            width: 400px;
            z-index: 3;
        }

        /* --- MASSIVE PLANT --- */
        .plant-element {
            position: absolute;
            bottom: -150px;
            left: -150px;
            width: 2200px;
            height: auto;
            z-index: 10;
            pointer-events: none;
            transform-origin: bottom left;
            animation: swayPlant 4s infinite ease-in-out;
        }

        @keyframes swayPlant {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(1.5deg); }
        }
    </style>
</head>
<body>

    <div class="scene">
        <div class="eevee-peekaboo">
            <video autoplay muted loop playsinline>
                <source src="Peekaboo.webm" type="video/webm">
            </video>
        </div>

        <img src="desk.png.png" alt="Desk" class="desk-layer">

        <div class="lava-lamp">
            <div class="lamp-top"></div>
            <div class="lamp-glass">
                <div class="lava-blob-1"></div>
                <div class="lava-blob-2"></div>
            </div>
            <div class="lamp-bottom"></div>
        </div>

        <div class="eevee-sleep">
            <video autoplay muted loop playsinline>
                <source src="sleep.webm" type="video/webm">
            </video>
        </div>

        <div class="eevee-tea">
            <video autoplay muted loop playsinline>
                <source src="tea.webm" type="video/webm">
            </video>
        </div>

        <img src="plant.png.png" alt="Plant" class="plant-element">
    </div>

    <script>
        const peekVideo = document.querySelector('.eevee-peekaboo video');
        if (peekVideo) {
            peekVideo.playbackRate = 0.75;
        }
    </script>

</body>
</html>
