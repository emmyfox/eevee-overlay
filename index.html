<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eevee Cozy Room</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background-color: #fce4ec;
        }

        body {
            background-image: url('background.png.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .scene {
            position: relative;
            width: 1920px;
            height: 1080px;
        }

        /* --- PEEK-A-BOO EEVEE --- */
        .eevee-peekaboo {
            position: absolute;
            top: -50px;
            left: 680px;
            width: 450px;
            z-index: 1;
        }

        .eevee-peekaboo video {
            width: 100%;
            height: auto;
            display: block;
            pointer-events: none;
        }

        /* --- DESK WITH MONITOR OVERLAY --- */
        .desk-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 1920px;
            height: 1080px;
            object-fit: cover;
            z-index: 2;
            pointer-events: none;
        }

        /* --- LAVA LAMP WRAPPER (Shifted far left completely off the keyboard, right into your red circle space) --- */
        .lava-lamp-container {
            position: absolute;
            bottom: 300px;
            left: 580px;
            width: 160px;
            height: 320px;
            z-index: 3;
            pointer-events: none;
        }

        /* The lamp PNG sits underneath so its outline frames everything */
        .lava-lamp-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: auto;
            display: block;
            z-index: 1;
            filter: drop-shadow(0 0 15px rgba(255, 182, 193, 0.8));
        }

        /* Animated pink lava placed ON TOP of the PNG using screen blend mode so it glows brightly right through the glass */
        .lava-animation-chamber {
            position: absolute;
            top: 58px;
            left: 48px;
            width: 64px;
            height: 160px;
            z-index: 2;
            overflow: hidden;
            border-radius: 30px;
            mix-blend-mode: screen; 
        }

        .lava-blob-1, .lava-blob-2 {
            position: absolute;
            background: #ff1493;
            border-radius: 50%;
            filter: blur(3px);
            opacity: 0.95;
        }

        .lava-blob-1 {
            width: 48px;
            height: 58px;
            bottom: 5px;
            left: 8px;
            animation: floatBlob1 6s ease-in-out infinite alternate;
        }

        .lava-blob-2 {
            width: 40px;
            height: 50px;
            top: 5px;
            right: 8px;
            animation: floatBlob2 8s ease-in-out infinite alternate;
        }

        @keyframes floatBlob1 {
            0% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-55px) scale(1.2, 0.9); }
            100% { transform: translateY(-90px) scale(0.8, 1.1); }
        }

        @keyframes floatBlob2 {
            0% { transform: translateY(0) scale(1); }
            50% { transform: translateY(55px) scale(1.1, 0.8); }
            100% { transform: translateY(85px) scale(0.9, 1.05); }
        }

        video {
            width: 100%;
            height: auto;
            pointer-events: none;
            display: block;
        }

        /* --- SLEEPING EEVEE --- */
        .eevee-sleep {
            position: absolute;
            bottom: 120px;
            left: 280px;
            width: 450px;
            z-index: 3;
        }

        /* --- TEA EEVEE --- */
        .eevee-tea {
            position: absolute;
            bottom: 270px;
            left: 1320px;
            width: 400px;
            z-index: 3;
        }

        /* --- MASSIVE PLANT --- */
        .plant-element {
            position: absolute;
            bottom: -150px;
            left: -150px;
            width: 2200px;
            height: auto;
            z-index: 10;
            pointer-events: none;
            transform-origin: bottom left;
            animation: swayPlant 4s infinite ease-in-out;
        }

        @keyframes swayPlant {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(1.5deg); }
        }
    </style>
</head>
<body>

    <div class="scene">
        <div class="eevee-peekaboo">
            <video autoplay muted loop playsinline>
                <source src="Peekaboo.webm" type="video/webm">
            </video>
        </div>

        <img src="desk.png.png" alt="Desk" class="desk-layer">

        <!-- Lava Lamp moved off the keyboard into the red circle space with visible glowing lava on top -->
        <div class="lava-lamp-container">
            <img src="lavalamp.png" alt="Lava Lamp" class="lava-lamp-img">
            <div class="lava-animation-chamber">
                <div class="lava-blob-1"></div>
                <div class="lava-blob-2"></div>
            </div>
        </div>

        <div class="eevee-sleep">
            <video autoplay muted loop playsinline>
                <source src="sleep.webm" type="video/webm">
            </video>
        </div>

        <div class="eevee-tea">
            <video autoplay muted loop playsinline>
                <source src="tea.webm" type="video/webm">
            </video>
        </div>

        <img src="plant.png.png" alt="Plant" class="plant-element">
    </div>

    <script>
        const peekVideo = document.querySelector('.eevee-peekaboo video');
        if (peekVideo) {
            peekVideo.playbackRate = 0.75;
        }
    </script>

</body>
</html>
